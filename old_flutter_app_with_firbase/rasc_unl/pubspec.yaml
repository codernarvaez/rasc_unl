name: unl_race
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  assets_audio_player: ^3.1.1
  connectivity_plus: ^5.0.1
  firebase_auth: ^4.12.1
  firebase_core: ^2.21.0
  firebase_database: ^10.3.3
  firebase_messaging: ^14.7.4
  firebase_storage: ^11.4.1
  flutter:
    sdk: flutter
  flutter_timer_countdown: ^1.0.7
  googleapis: ^13.1.0
  googleapis_auth: ^1.5.1
  http: ^1.1.0
  intl: ^0.19.0
  intl_phone_number_input: ^0.7.4
  loading_animation_widget: ^1.2.0+4
  package_info_plus: 5.0.1
  permission_handler: ^11.0.1
  pdf: ^3.3.0
  printing: ^5.5.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.0
  google_maps_flutter: ^2.5.3
  pinput: ^5.0.2
  url_launcher: ^6.3.2
  flutter_geofire: ^2.0.6
  flutter_polyline_points: ^2.0.0
  geolocator: ^11.1.0
  ripple_wave: ^0.1.5
  flutter_rating_bar: ^4.0.1
  

dev_dependencies:
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - .env

  fonts:
    - family: QuicksandBold
      fonts:
        - asset: assets/fonts/Quicksand-Bold.ttf
    - family: QuicksandLight
      fonts:
        - asset: assets/fonts/Quicksand-Light.ttf
    - family: QuicksandMedium
      fonts:
        - asset: assets/fonts/Quicksand-Medium.ttf
    - family: QuicksandRegular
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
    - family: QuicksandSemiBold
      fonts:
        - asset: assets/fonts/Quicksand-SemiBold.ttf
